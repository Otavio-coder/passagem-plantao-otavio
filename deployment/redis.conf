# ============================================================================
# Redis configuration — Passagem de Plantão
# Ubuntu 20.04/22.04
#
# Install:
#   sudo apt install redis-server
#   sudo cp deployment/redis.conf /etc/redis/redis.conf
#   sudo systemctl restart redis-server
#   sudo systemctl enable redis-server
#
# Verify:
#   redis-cli ping        → PONG
#   redis-cli info memory → check used_memory_human
# ============================================================================

# ---------------------------------------------------------------------------
# Network
# Bind to localhost only — this app runs on the same machine as Apache.
# Do NOT expose Redis to the network unless you add firewall rules + requirepass.
# ---------------------------------------------------------------------------
bind 127.0.0.1
port 6379
protected-mode yes

# ---------------------------------------------------------------------------
# Memory management — CRITICAL for Laravel
#
# Set maxmemory to ~25% of total server RAM. Examples:
#   4 GB server  → 1024mb
#   8 GB server  → 2048mb
#   16 GB server → 4096mb
#
# allkeys-lru: when memory is full, evict least-recently-used keys.
# This is the correct policy for Laravel cache + session + queue combined.
# Without it, Redis throws OOM errors and Laravel queue/session breaks.
# ---------------------------------------------------------------------------
maxmemory 512mb
maxmemory-policy allkeys-lru

# ---------------------------------------------------------------------------
# Persistence — RDB snapshots (fast recovery) + AOF (durable queue/session)
#
# RDB: saves a point-in-time snapshot to disk.
#   "save 900 1"    → save if 1 key changed in 900s (15 min)
#   "save 300 10"   → save if 10 keys changed in 300s (5 min)
#   "save 60 10000" → save if 10,000 keys changed in 60s (busy periods)
#
# AOF: logs every write command. appendfsync everysec = at most 1s data loss.
# AOF ensures queue jobs (WarmSectorCacheJob, SyncUserPhotoJob) survive a
# Redis restart without loss.
# ---------------------------------------------------------------------------
save 900 1
save 300 10
save 60 10000

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ---------------------------------------------------------------------------
# Directories
# ---------------------------------------------------------------------------
dir /var/lib/redis
dbfilename dump.rdb

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
loglevel notice
logfile /var/log/redis/redis-server.log

# ---------------------------------------------------------------------------
# Connection limits
# Adjust maxclients based on PHP-FPM pm.max_children + queue workers.
# Formula: (pm.max_children + numprocs_workers) * 2 + 20
# Default PHP-FPM + 2 workers: (20 + 2) * 2 + 20 = 64 → 100 is safe.
# ---------------------------------------------------------------------------
timeout 300
tcp-keepalive 60
maxclients 100

# ---------------------------------------------------------------------------
# Laravel-specific: disable key-space notifications (not needed, saves CPU)
# ---------------------------------------------------------------------------
notify-keyspace-events ""

# ---------------------------------------------------------------------------
# Slow log: log queries taking more than 10ms (useful for diagnosing issues)
# ---------------------------------------------------------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128
