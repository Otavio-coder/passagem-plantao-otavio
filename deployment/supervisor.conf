; ============================================================================
; Supervisor configuration — Passagem de Plantão
; Ubuntu 20.04/22.04 + Apache
;
; Install:
;   sudo apt install supervisor
;   sudo cp deployment/supervisor.conf /etc/supervisor/conf.d/passagem-plantao.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start passagem-plantao:*
;
; Verify status:
;   sudo supervisorctl status
;   sudo supervisorctl tail -f laravel-worker:laravel-worker_00
; ============================================================================

; ---------------------------------------------------------------------------
; Queue Worker — único worker para todos os jobs: WarmSectorCacheJob,
; SyncUserPhotoJob, RunArtisanCommand (análise IA), etc.
; timeout=660s cobre o pior caso: analysis:run com todos os plantonistas.
; Driver: database (QUEUE_CONNECTION=database no .env)
; ---------------------------------------------------------------------------
[program:laravel-worker]
command=php /var/www/passagem-plantao/artisan queue:work database --sleep=3 --tries=3 --timeout=660 --max-time=3600 --queue=default
directory=/var/www/passagem-plantao
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/laravel-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=660

; ---------------------------------------------------------------------------
; Reverb WebSocket Server — real-time chat for shift annotations.
; Apache proxies wss://domain/app/* → ws://127.0.0.1:8080/app/*
; See README for Apache VirtualHost proxy config.
; ---------------------------------------------------------------------------
[program:laravel-reverb]
command=php /var/www/passagem-plantao/artisan reverb:start --host=0.0.0.0 --port=8080
directory=/var/www/passagem-plantao
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/laravel-reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; ---------------------------------------------------------------------------
; Group shortcut so you can start/stop all processes at once:
;   sudo supervisorctl start passagem-plantao:*
;   sudo supervisorctl restart passagem-plantao:*
; ---------------------------------------------------------------------------
[group:passagem-plantao]
programs=laravel-worker,laravel-reverb
